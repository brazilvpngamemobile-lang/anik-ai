<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Anik AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #09090b; --card-bg: #121216; --primary: #6366f1; --primary-glow: rgba(99, 102, 241, 0.3); --text-main: #f8fafc; --text-muted: #94a3b8; --border: #27272a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; height: 100dvh; padding: 10px; overflow: hidden; background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.05) 0%, transparent 70%); }
        .studio-container { background: var(--card-bg); border: 1px solid var(--border); padding: 20px 20px; border-radius: 24px; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7); width: 100%; max-width: 420px; max-height: 100%; display: flex; flex-direction: column; gap: 12px; animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .header { text-align: center; margin-bottom: 5px; }
        .header h1 { font-size: clamp(28px, 8vw, 36px); font-weight: 800; margin-bottom: 6px; letter-spacing: -1px; background: linear-gradient(120deg, #a5b4fc 30%, #ffffff 50%, #a5b4fc 70%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: metallicShine 3.5s linear infinite; filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.3)); }
        @keyframes metallicShine { to { background-position: 200% center; } }
        .header p { color: var(--text-muted); font-size: clamp(10px, 3vw, 12px); font-weight: 500; letter-spacing: 2px; text-transform: uppercase; }
        
        .input-group { display: flex; flex-direction: column; gap: 6px; width: 100%; }
        .label-row { display: flex; justify-content: space-between; align-items: center; }
        label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
        
        .char-counter { font-size: 11px; color: var(--text-muted); font-weight: 600; transition: color 0.3s; }
        .char-counter.warning { color: #f59e0b; }
        .char-counter.danger { color: #ef4444; }
        
        textarea, select { width: 100%; padding: 12px; border-radius: 12px; background: #0a0a0c; border: 1px solid var(--border); color: var(--text-main); font-size: 14px; outline: none; transition: all 0.3s ease; resize: none; }
        textarea { height: 100px; }
        textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        
        select { appearance: none; -webkit-appearance: none; padding-right: 30px; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 12px center; background-size: 10px auto; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        select optgroup { background: #18181b; color: var(--primary); font-weight: 600; font-style: normal; padding-top: 5px; }
        select option { background: var(--card-bg); color: var(--text-main); font-weight: 400; padding: 5px; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 5px 0; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--primary-glow); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: var(--border); border-radius: 2px; }
        
        button { width: 100%; height: 46px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; color: white; background: var(--primary); cursor: pointer; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; margin-top: 5px; box-shadow: 0 4px 15px -3px var(--primary-glow); }
        button:hover { background: #4f46e5; }
        button:disabled { cursor: not-allowed; opacity: 0.8; }
        button.loading { animation: pulse 1.5s infinite; background: #4f46e5; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(99, 102, 241, 0); } 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); } }
        
        .dynamic-area { height: 90px; display: flex; align-items: center; justify-content: center; margin-top: 5px; position: relative; }
        .wave-loader-container { display: none; width: 100%; height: 100%; background: #18181b; border-radius: 16px; border: 1px solid var(--border); justify-content: center; align-items: center; gap: 5px; }
        .wave-bar { width: 5px; background: var(--primary); border-radius: 3px; animation: wave 1.2s ease-in-out infinite; }
        .wave-bar:nth-child(1) { animation-delay: 0.0s; } .wave-bar:nth-child(2) { animation-delay: 0.1s; } .wave-bar:nth-child(3) { animation-delay: 0.2s; } .wave-bar:nth-child(4) { animation-delay: 0.3s; } .wave-bar:nth-child(5) { animation-delay: 0.4s; } .wave-bar:nth-child(6) { animation-delay: 0.5s; } .wave-bar:nth-child(7) { animation-delay: 0.6s; }
        @keyframes wave { 0%, 100% { height: 12px; opacity: 0.5; } 50% { height: 35px; opacity: 1; box-shadow: 0 0 10px var(--primary-glow); } }
        
        .result-section { display: none; width: 100%; height: 100%; flex-direction: column; justify-content: space-between; }
        .result-section.active { display: flex; animation: fadeIn 0.4s ease forwards; }
        .custom-player { background: #18181b; border: 1px solid var(--border); border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; width: 100%; height: 50px; }
        .play-btn { background: var(--primary); border: none; width: 34px; height: 34px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; color: white; flex-shrink: 0; padding: 0; margin: 0; box-shadow: none; }
        .play-btn svg { width: 16px; height: 16px; fill: currentColor; margin-left: 2px; }
        .progress-container { flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .progress-bar { width: 100%; height: 4px; background: #3f3f46; border-radius: 2px; cursor: pointer; position: relative; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; border-radius: 2px; }
        .time-info { display: flex; justify-content: space-between; font-size: 9px; color: var(--text-muted); font-weight: 500; }
        .download-btn { display: flex; justify-content: center; align-items: center; gap: 6px; width: 100%; padding: 10px; border-radius: 12px; background: transparent; color: #f8fafc; border: 1px solid var(--border); text-decoration: none; font-weight: 500; font-size: 13px; transition: all 0.2s; margin-top: 8px; }
        .download-btn:hover { background: #27272a; }
        .error-box { color: #f87171; font-size: 11px; padding: 8px; background: rgba(248, 113, 113, 0.1); border-radius: 8px; border: 1px solid rgba(248, 113, 113, 0.2); display: none; text-align: center; }
    </style>
</head>
<body>
    <div class="studio-container">
        <div class="header">
            <h1>Anik AI</h1>
            <p>Premium Neural Speech</p>
        </div>
        <form id="ttsForm" style="display: flex; flex-direction: column; gap: 10px;">
            <div class="input-group">
                <div class="label-row">
                    <label>Text Input</label>
                    <span class="char-counter" id="charCount">0 / 500</span>
                </div>
                <textarea id="textInput" placeholder="Type or paste text here (Max 500 characters)..." maxlength="500" required></textarea>
            </div>
            <div class="input-group">
                <label>Speed Control <span id="speedValue" style="color: var(--primary);">0.9x</span></label>
                <input type="range" id="speedControl" min="0.7" max="1.1" step="0.1" value="0.9">
            </div>
            <div class="input-group">
                <label>Voice Profile</label>
                <select id="voiceSelect">
                    <optgroup label="Female Voices">
                        <option value="Professional Female" selected>Professional Female</option>
                        <option value="Cheerful Female">Cheerful Female</option>
                    </optgroup>
                    <optgroup label="Male Voices">
                        <option value="Professional Male">Professional Male</option>
                        <option value="Deep Male">Deep Male</option>
                        <option value="News Anchor">News Anchor</option>
                    </optgroup>
                    <optgroup label="Special Effects">
                        <option value="Whispering">Whispering</option>
                    </optgroup>
                </select>
            </div>
            <button type="submit" id="submitBtn">Generate Voice</button>
        </form>
        <div id="errorBox" class="error-box"></div>
        <div class="dynamic-area">
            <div class="wave-loader-container" id="waveLoader">
                <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            </div>
            <div class="result-section" id="resultSection">
                <div class="custom-player">
                    <button class="play-btn" id="playBtn" type="button">
                        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
                        <div class="time-info"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
                    </div>
                </div>
                <audio id="audioPlayer" src=""></audio>
                <a href="/download" class="download-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Download Audio
                </a>
            </div>
        </div>
    </div>
    <script>
        const form = document.getElementById('ttsForm'); const submitBtn = document.getElementById('submitBtn'); const waveLoader = document.getElementById('waveLoader'); const resultSection = document.getElementById('resultSection'); const errorBox = document.getElementById('errorBox');
        const speedControl = document.getElementById('speedControl'); const speedValue = document.getElementById('speedValue'); speedControl.addEventListener('input', (e) => speedValue.innerText = e.target.value + 'x');
        
        const textInput = document.getElementById('textInput');
        const charCount = document.getElementById('charCount');
        const maxChars = 500;

        textInput.addEventListener('input', () => {
            const currentLength = textInput.value.length;
            charCount.innerText = `${currentLength} / ${maxChars}`;
            
            if (currentLength > 400) {
                charCount.className = 'char-counter warning';
            }
            if (currentLength === maxChars) {
                charCount.className = 'char-counter danger';
            }
            if (currentLength < 400) {
                charCount.className = 'char-counter';
            }
        });

        const audio = document.getElementById('audioPlayer'); const playBtn = document.getElementById('playBtn'); const playIcon = document.getElementById('playIcon'); const pauseIcon = document.getElementById('pauseIcon'); const progressBar = document.getElementById('progressBar'); const progressFill = document.getElementById('progressFill'); const currentTimeEl = document.getElementById('currentTime'); const durationEl = document.getElementById('duration');
        playBtn.addEventListener('click', () => { if (audio.paused) { audio.play(); playIcon.style.display = 'none'; pauseIcon.style.display = 'block'; } else { audio.pause(); playIcon.style.display = 'block'; pauseIcon.style.display = 'none'; } });
        audio.addEventListener('timeupdate', () => { const percent = (audio.currentTime / audio.duration) * 100; progressFill.style.width = percent + '%'; currentTimeEl.innerText = formatTime(audio.currentTime); });
        audio.addEventListener('loadedmetadata', () => { durationEl.innerText = formatTime(audio.duration); });
        audio.addEventListener('ended', () => { playIcon.style.display = 'block'; pauseIcon.style.display = 'none'; progressFill.style.width = '0%'; });
        progressBar.addEventListener('click', (e) => { const rect = progressBar.getBoundingClientRect(); const pos = (e.clientX - rect.left) / rect.width; audio.currentTime = pos * audio.duration; });
        function formatTime(seconds) { if(isNaN(seconds)) return "0:00"; const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60); return `${m}:${s < 10 ? '0' : ''}${s}`; }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = textInput.value; const voice = document.getElementById('voiceSelect').value; const speed = speedControl.value;
            
            if(text.length > maxChars) {
                errorBox.style.display = 'block'; errorBox.innerText = "Text exceeds limit! Please shorten your text.";
                return;
            }

            submitBtn.disabled = true; submitBtn.innerText = "Synthesizing..."; submitBtn.classList.add('loading'); resultSection.classList.remove('active'); errorBox.style.display = 'none'; audio.pause(); waveLoader.style.display = 'flex';
            
            try {
                const response = await fetch('/generate', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ text: text, voice: voice, speed: speed }) 
                });
                
                // সার্ভার রেসপন্স সফল কিনা চেক করা
                if (!response.ok) {
                    let errorMsg = `Server error: ${response.status}`;
                    try {
                        const errData = await response.json();
                        if (errData.error) errorMsg = errData.error;
                    } catch (e) {
                        // যদি JSON পার্স না হয়, ডিফল্ট মেসেজই থাকবে
                    }
                    throw new Error(errorMsg);
                }

                const data = await response.json();
                
                if (data.success) {
                    setTimeout(() => {
                        submitBtn.disabled = false; submitBtn.innerText = "Generate Voice"; submitBtn.classList.remove('loading'); waveLoader.style.display = 'none';
                        audio.src = data.audio_url + "?t=" + new Date().getTime(); audio.load(); audio.play(); playIcon.style.display = 'none'; pauseIcon.style.display = 'block'; resultSection.classList.add('active');
                    }, 500);
                } else { 
                    throw new Error(data.error || "Unknown error occurred."); 
                }
            } catch (error) {
                submitBtn.disabled = false; submitBtn.innerText = "Generate Voice"; submitBtn.classList.remove('loading'); waveLoader.style.display = 'none'; errorBox.style.display = 'block'; errorBox.innerText = "Error: " + error.message;
            }
        });
    </script>
</body>
</html>
